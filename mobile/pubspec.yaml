name: ala_archa
description: "Ala-Archa National Park - AI-powered park super app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.7
  firebase_storage: ^12.4.3
  firebase_messaging: ^15.2.3

  # Auth
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4

  # Routing
  go_router: ^14.8.1

  # UI
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0

  # QR
  qr_flutter: ^4.1.0
  # mobile_scanner: ^6.0.5  # Re-add for staff gate-scanner app; needs static_framework config

  # Maps & Location
  mapbox_maps_flutter: ^2.5.0
  geolocator: ^13.0.2

  # Network
  dio: ^5.8.0+1

  # Storage
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5

  # Utils
  intl: ^0.20.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.4
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.15
  json_serializable: ^6.9.5
  json_annotation: ^4.9.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/maps/
